# Register block spec: irq_ctrl
# This is the SINGLE SOURCE OF TRUTH for this block.
# All RTL, firmware headers, and documentation are generated from this file.
#
# Real tools that consume specs like this: PeakRDL, Semifore, Agnisys, Synopsys Register Compiler.
# They typically use SystemRDL syntax; we use YAML here for readability while learning.

block: irq_ctrl           # Name of the register block → becomes the RTL module name
base_addr: 0x40001000     # Base address in the chip's memory map (hex)
reg_width: 32             # All registers are 32 bits wide

registers:
  - name: CTRL
    offset: 0x00          # Byte offset from base_addr (software writes to base_addr + 0x00)
    desc: "Control register — enables and configures the interrupt controller"
    fields:
      # bits: "0"   → single bit at position 0
      # bits: "2:1" → two-bit field occupying bits 2 down to 1 (MSB:LSB notation)
      - { name: ENABLE,  bits: "0",   access: rw, reset: 0, desc: "Global interrupt enable (1=enabled)" }
      - { name: MODE,    bits: "2:1", access: rw, reset: 0, desc: "Operating mode (00=level, 01=edge, 10=pulse)" }
      - { name: PRIORITY, bits: "5:3", access: rw, reset: 0, desc: "Interrupt priority level (0=lowest, 7=highest)" }

  - name: STATUS
    offset: 0x04          # Next register is 4 bytes away (one 32-bit word)
    desc: "Status register — reflects current hardware state (read-only to software)"
    fields:
      # access: ro → software can only READ this; hardware WRITES it
      # This models a status signal driven by HW logic into the register
      - { name: BUSY, bits: "0",   access: ro, reset: 0, desc: "Hardware busy flag (1=busy, set by HW)" }
      - { name: IRQ,  bits: "1",   access: ro, reset: 0, desc: "Interrupt pending flag (1=interrupt active, set by HW)" }
      - { name: ERR,  bits: "2",   access: ro, reset: 0, desc: "Error flag (1=error detected, set by HW)" }

  - name: IRQ_STS
    offset: 0x08
    desc: "Interrupt status register — HW sets bits when IRQs fire; SW writes 1 to clear (acknowledge)"
    fields:
      # access: w1c → Write-1-to-Clear.
      # Hardware sets the bit (via a dedicated _set input port in the RTL).
      # Software reads to see which IRQs are pending, then writes 1 to the handled bits to clear them.
      # This is how ARM GIC, RISC-V PLIC, and virtually every real IRQ controller works.
      - { name: IRQ0_PEND, bits: "0", access: w1c, reset: 0, desc: "IRQ channel 0 pending (HW sets; SW writes 1 to ack)" }
      - { name: IRQ1_PEND, bits: "1", access: w1c, reset: 0, desc: "IRQ channel 1 pending (HW sets; SW writes 1 to ack)" }
      - { name: IRQ2_PEND, bits: "2", access: w1c, reset: 0, desc: "IRQ channel 2 pending (HW sets; SW writes 1 to ack)" }

  - name: TRIG
    offset: 0x0C
    desc: "Software trigger register — write to fire a soft interrupt; readback is always 0"
    fields:
      # access: wo → Write-Only.
      # A write pulses the trigger into the HW logic. Reading back would return stale/meaningless
      # state, so the RTL hardwires PRDATA to 0 for this field on reads.
      - { name: SOFT_IRQ, bits: "0", access: wo, reset: 0, desc: "Write 1 to assert a software interrupt (pulse)" }
      - { name: SOFT_NMI, bits: "1", access: wo, reset: 0, desc: "Write 1 to assert a software NMI (non-maskable interrupt)" }

  - name: FIFO_STS
    offset: 0x10
    desc: "FIFO status register — reports pending event count; reading clears the count (read-to-clear)"
    fields:
      # access: rclr → Read-to-Clear.
      # Reading this field returns its current value AND simultaneously resets it to 0.
      # Models a saturating event counter: HW increments it on each event; SW reads (and clears)
      # to drain the count. Common in UART FIFOs and hardware event loggers.
      - { name: EVT_COUNT, bits: "3:0", access: rclr, reset: 0, desc: "Pending event count (0-15); clears to 0 on read" }
